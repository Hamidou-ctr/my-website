@for (project of projects; track project.name; let idx = $index) {
  <section
    class="project-item w-full flex flex-col md:flex-row justify-between gap-[5%] items-center lx:gap-[15%] xl:gap-[25%] mt-10"
    [class.image-right]="idx % 2 === 1"
  >
    <img
      [src]="project.imageUrl"
      [alt]="project.name"
      class="project-image w-full max-w-150 object-cover xsm:w-140 md:w-[45%]"
    />

    <div
      class="project-content max-w-lg md:w-[48%] gap-4 p-8 lt:p-0 flex flex-col justify-center items-center md:items-start"
      [class.text-right]="idx % 2 === 1"
    >
      <h1 class="text-4xl font-bold text-[#9747FF]">{{ project.name }}</h1>
      <p class="text-2xl font-normal text-[#70E61C]">{{ project.language }}</p>
      <p class="text-lg font-normal">{{ project.description }}</p>
      <div
        class="flex items-center gap-[10%] xxs:gap-[30%] xs:gap-24 md:gap-8 lm:gap-20 lt:gap-24 text-2xl font-normal md:justify-start"
        [class.justify-end]="idx % 2 === 1"
      >
        <a [href]="project.liveTestUrl" target="_blank">
          <button
            class="bg-[#9747FF] hover:bg-[#70E61C] text-nowrap text-white px-4 py-2 xs:px-8 xs:py-4 rounded-xl"
          >
            Live Test
          </button>
        </a>
        <a [href]="project.githubUrl" target="_blank">
          <button
            class="hover:bg-[#70E61C] border-[#70E61C] border text-white px-4 py-2 xs:px-8 xs:py-4 rounded-xl"
          >
            GitHub
          </button>
        </a>
      </div>
    </div>
  </section>
} @empty {
  <h1>Keine Projekte verfügbar</h1>
}
