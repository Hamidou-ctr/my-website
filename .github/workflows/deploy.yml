name: Deploy Angular App

on:
  push:
    branches:
      - main  # oder master, je nach deinem Hauptbranch
  workflow_dispatch:  # Ermöglicht manuelles Ausführen

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Node.js einrichten (Version 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: npm ci
      
      # 4. Angular App bauen (Production)
      - name: Build Angular app
        run: npm run build -- --configuration=production
        # Oder falls du kein build script hast: npx ng build --configuration=production
      
      # 5. SSH Agent einrichten und Schlüssel hinzufügen
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      # 6. Build-Artifakte auf den Server kopieren
      - name: Deploy to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/my-website/browser/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
      
      # 7. Optional: Berechtigungen auf dem Server setzen
      - name: Set permissions (optional)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "chmod -R 755 ${{ secrets.DEPLOY_PATH }}"