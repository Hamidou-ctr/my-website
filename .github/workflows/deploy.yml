name: Deploy Angular App to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # Aktualisiert auf v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Aktualisiert auf v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration=production

      - name: Prepare build files
        run: |
          mkdir -p deploy_temp
          # Prüfe wo die Build-Dateien sind
          if [ -d "dist/my-website/browser" ]; then
            cp -r dist/my-website/browser/* deploy_temp/
          elif [ -d "dist/my-website" ]; then
            cp -r dist/my-website/* deploy_temp/
          else
            echo "Build directory not found!"
            ls -la dist/
            exit 1
          fi
          ls -la deploy_temp/

      - name: Debug SSH Connection
        run: |
          echo "Testing SSH connection..."
          # Temporäre SSH-Konfiguration
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # Teste die Verbindung mit mehr Details
          ssh -v -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH connection successful!'" || {
            echo "SSH connection failed!"
            echo "Please check:"
            echo "1. SSH_PRIVATE_KEY secret is correct"
            echo "2. DEPLOY_USER is correct"
            echo "3. DEPLOY_HOST is correct"
            echo "4. Server allows key authentication"
            exit 1
          }

      - name: Deploy to Server
        run: |
          # Setup SSH
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # Erstelle Backup und deploye
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            
            # Erstelle Backup-Verzeichnis falls nötig
            mkdir -p ${{ secrets.DEPLOY_PATH }}/../backups
            
            # Backup des aktuellen Deployments
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            cd ${{ secrets.DEPLOY_PATH }}
            tar -czf ../backups/backup_${TIMESTAMP}.tar.gz . 2>/dev/null || true
            
            # Lösche alte Dateien (aber schütze .well-known und configs)
            find . -maxdepth 1 ! -name '.well-known' ! -name '*.php' ! -name '.htaccess' ! -name '.' ! -name '..' -exec rm -rf {} + 2>/dev/null || true
          EOF
          
          # Kopiere neue Dateien
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -r deploy_temp/* \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/
          
          # Setze Berechtigungen
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "chmod -R 755 ${{ secrets.DEPLOY_PATH }} && ls -la ${{ secrets.DEPLOY_PATH }}"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/deploy_key
          rm -rf deploy_temp